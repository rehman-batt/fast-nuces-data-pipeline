[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-corpus"
version = "0.1.0"
description = "A polite, reproducible public-web corpus pipeline for FAST-NUCES"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fast-corpus = "fast_corpus.cli:main"

[tool.setuptools.packages.find]
include = ["fast_corpus*"]
